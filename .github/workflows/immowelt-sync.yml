name: Angebote von Immowelt abgleichen

on:
  schedule:
    - cron: "15 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: immowelt-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Angebote abrufen
        run: python tools/immowelt-sync.py
      - name: Änderungen speichern
        id: commit
        run: |
          git config user.name "CMB Website Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/objekte.json assets/img/objekte
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Keine Änderungen."
          else
            git commit -m "Angebote von Immowelt aktualisiert"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: GitHub Pages neu bauen
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
